  <title id="dock-title">靜海修船塢・撤架之前｜視覺草案</title>
  <desc id="dock-desc">來源：content/lore/places/tranquility-repair-dock.json。白色艙板沿吊架展開如翼，微小工人在船腹光下撤架，交接處有人等待，艙門尚未閉合，塢口露出黑天。船型、建築、服裝、配色、視角及空間配置均為美術提案；人物只是未具名尺度剪影，不指認設定角色。外圍留透明，沒有全幅背景。</desc>
