<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760">
  <title>Terrain readability and static effect art</title>
  <desc>Static SVG composition only, not animation timeline. Unit circle, HP and selection are demonstration overlays.</desc>
