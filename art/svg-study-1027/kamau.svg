<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="output-title output-desc">
  <title id="output-title">卡茂・恩德瓜｜3/4機戰動畫立繪・美術提案</title>
  <desc id="output-desc">依 content/lore/characters/kamau-ndegwa.json：46歲男性機械系駕駛，外貌約34歲，沒有角鱗。採輕微3/4臉向與肩胸轉折，收斂杏眼、側向警覺視線、短簡鼻影、細口線與斜向成束短捲髮；深青灰立領工作服保留赭黃肩部補強。左上光源以大面積硬邊明暗表現。膚色、五官、神情、髮型、衣著、配色與其餘未載細節全為美術提案，並非正史定案。本張已獲主線目視接受，設計保留不變；同族接點以本張為基準。薩米爾及交叉換件待領導重建目視。透明背景；幾何唯一來源 portrait-parts.svg。 視覺草案；來源：portrait-parts.svg + portrait-manifest.json，由rebuild.py重建，未載細節均美術提案。</desc>
