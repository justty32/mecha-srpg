    <desc id="item-4-shot-desc">透明正方特效，從左向右的窄曳光與短促火花；幾何色塊無濾鏡。以img.fx-art配合effects.css手動播放；武器視覺為美術提案，不代表新增設定或遊戲整合。</desc>
