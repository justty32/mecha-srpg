    <desc id="item-3-cover-desc">正方俯視折角低牆掩體，上側橫牆與左側短牆形成辨識輪廓，中央及下側保留單位和HP空間，四邊透明。形制與材質為美術提案，不表示新增防禦數值，未接入遊戲。</desc>
