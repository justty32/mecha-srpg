<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="output-title output-desc">
  <title id="output-title">薩米爾・卡恩｜3/4老年機戰動畫立繪・美術提案</title>
  <desc id="output-desc">依 content/lore/characters/samir-khan.json 的2108段：實齡45歲、看起來像60歲。沿已接受卡茂的固定輕微3/4視角與左上光源，以鬆垂下頰、灰眉垂瞼、後退髮際、灰白長鬚呈現年長感；灰綠內袍與亞麻披領隨肩胸轉折。兩種臉的額顱、耳根、頸外形一致，眉眼、鼻口及衣領依同族anchors定位，頭髮與五官不混入face，衣服不含膚色。老年長鬚隨mouth部件換入並覆頸衣，兩種膚色共用鼻影與唇光色；完整預設及交叉組合仍待領導重建目視。膚色、五官、髮鬚、神情、衣著與配色全為美術提案。手部酸蝕疤未移至臉上，未添加徽記或證實迦梨傳聞。透明背景；幾何唯一來源 portrait-parts.svg。 視覺草案；來源：portrait-parts.svg + portrait-manifest.json，由rebuild.py重建，未載細節均美術提案。</desc>
