    <desc id="item-6-explosion-desc">透明正方特效，分離煙瓣、暖色破環與少量碎片包圍透空中心；無全格閃光、無濾鏡。以img.fx-art配合effects.css手動單次播放，迅速淡出。形態與配色為美術提案，未接入遊戲。</desc>
